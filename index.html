<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Things PT — Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0a0a0a;
        --bg2: #111111;
        --bg3: #1a1a1a;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f0f0f0;
        --text2: #888;
        --accent: #e8ff47;
        --radius: 16px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
      }
      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        padding: 0 5%;
        display: flex;
        align-items: center;
        height: 64px;
        justify-content: space-between;
      }
      .logo {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 20px;
        color: var(--text);
        text-decoration: none;
      }
      .logo span {
        color: var(--accent);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 5%;
      }
      .nav-pills {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .pill {
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text2);
        padding: 10px 20px;
        border-radius: 100px;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.2s;
        font-weight: 600;
      }
      .pill.active {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }
      .breadcrumb {
        margin-bottom: 20px;
        font-size: 14px;
        color: var(--accent);
        cursor: pointer;
        display: none;
      }

      /* GRID E CARTÕES */
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }
      .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: 0.3s;
        height: 100%;
      }

      /* AQUI ESTÁ O SEGREDO DO TAMANHO DAS FOTOS */
      .card-img {
        width: 100%;
        height: 280px; /* Altura fixa para todos os produtos */
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card-img img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* 'contain' para não cortar o ténis, 'cover' se quiseres que preencha tudo */
        padding: 10px; /* Margem de segurança para o ténis não tocar nas bordas */
      }

      .card-body {
        padding: 20px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .selector-label {
        font-size: 11px;
        color: var(--text2);
        text-transform: uppercase;
        margin: 10px 0 5px;
      }
      select {
        background: var(--bg3);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 10px;
        font-family: inherit;
      }
      .card-footer {
        margin-top: auto;
        padding-top: 15px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .price {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 20px;
        color: var(--accent);
      }
      .btn-buy {
        background: var(--accent);
        color: #000;
        padding: 10px 15px;
        border-radius: 100px;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
      }
      .model-box {
        padding: 8px 12px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: 0.2s;
      }
      .model-box.active {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#" onclick="location.reload()" class="logo"
        >Smart <span>Things</span> PT</a
      >
    </nav>

    <div class="container">
      <div class="nav-pills" id="main-cats">
        <div class="pill active" onclick="showCat('Eletrónicos', this)">
          Eletrónicos
        </div>
        <div class="pill" onclick="showCat('Sneakers', this)">Sneakers</div>
        <div class="pill" onclick="showCat('Roupas', this)">Roupas</div>
      </div>

      <div id="breadcrumb" class="breadcrumb" onclick="resetSneakers()">
        ← Voltar às Marcas
      </div>
      <div class="products-grid" id="grid"></div>
    </div>

    <script>
      const WHATSAPP = "351927515217";

      const produtos = {
        Eletrónicos: [
          {
            nome: "Power Bank 20000mAh",
            preco: "25€",
            desc: "Carga rápida USB-C",
            img: "imagens/powerbank.jpg",
          },
        ],
        Roupas: [
          {
            nome: "T-Shirt Oversized Black",
            preco: "20€",
            desc: "100% Algodão Premium",
            img: "imagens/tshirt.jpg",
          },
        ],
        Sneakers: {
          Adidas: {
            Spezial: {
              tamanhos: ["36", "37", "38", "39", "40", "41", "42", "43", "44"],
              variacoes: [
                { id: "Modelo 1", img: "imagens/adidas/spezial/Modelo1.jpg" },
                { id: "Modelo 2", img: "imagens/adidas/spezial/Modelo2.jpg" },
                { id: "Modelo 3", img: "imagens/adidas/spezial/Modelo3.jpg" },
                { id: "Modelo 4", img: "imagens/adidas/spezial/Modelo4.jpg" },
                { id: "Modelo 5", img: "imagens/adidas/spezial/Modelo5.jpg" },
                { id: "Modelo 6", img: "imagens/adidas/spezial/Modelo6.jpg" },
              ],
            },
            forum: {
              tamanhos: ["36", "37", "38", "39", "40", "41", "42", "43", "44"],
              variacoes: [
                { id: "Modelo 1", img: "imagens/adidas/forumm/Modelo1.jpg" },
                { id: "Modelo 2", img: "imagens/adidas/forumm/Modelo2.jpg" },
                { id: "Modelo 3", img: "imagens/adidas/forumm/Modelo3.jpg" },
                { id: "Modelo 4", img: "imagens/adidas/forumm/Modelo4.jpg" },
                { id: "Modelo 5", img: "imagens/adidas/forumm/Modelo5.jpg" },
                { id: "Modelo 6", img: "imagens/adidas/forumm/Modelo6.jpg" },
              ],
            },
          },
          Nike: {
            "Air Force 1 x Supreme": {
              tamanhos: ["36", "38", "40", "42", "44"],
              variacoes: [
                {
                  id: "Modelo 1",
                  img: "imagens/nike/airforce1/AirForce1xSupreme.jpg",
                },
              ],
            },
          },
        },
      };

      function showCat(cat, el) {
        document
          .querySelectorAll("#main-cats .pill")
          .forEach((p) => p.classList.remove("active"));
        el.classList.add("active");
        document.getElementById("breadcrumb").style.display = "none";
        if (cat === "Sneakers") renderSneakerBrands();
        else renderNormalProducts(cat);
      }

      function renderNormalProducts(cat) {
        const grid = document.getElementById("grid");
        grid.innerHTML = produtos[cat]
          .map(
            (p) => `
          <div class="card">
            <div class="card-img"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=Sem+Foto'"></div>
            <div class="card-body">
              <div style="font-size:18px; font-weight:700;">${p.nome}</div>
              <p style="font-size:13px; color:var(--text2)">${p.desc}</p>
              <div class="card-footer">
                <div class="price">${p.preco}</div>
                <a href="https://wa.me/${WHATSAPP}?text=Olá! Tenho interesse no ${p.nome}" class="btn-buy">Quero este</a>
              </div>
            </div>
          </div>
        `,
          )
          .join("");
      }

      function renderSneakerBrands() {
        const grid = document.getElementById("grid");
        grid.innerHTML = Object.keys(produtos.Sneakers)
          .map(
            (marca) => `
          <div class="pill" style="width:100%; text-align:center; padding:30px; background:var(--bg2)" onclick="renderModels('${marca}')">
            ${marca}
          </div>
        `,
          )
          .join("");
      }

      function renderModels(marca) {
        document.getElementById("breadcrumb").style.display = "block";
        const grid = document.getElementById("grid");
        const modelos = produtos.Sneakers[marca];

        grid.innerHTML = Object.keys(modelos)
          .map((mod) => {
            const d = modelos[mod];
            const id = `${marca}-${mod}`.replace(/\s+/g, "-");
            return `
            <div class="card">
              <div class="card-img"><img src="${d.variacoes[0].img}" id="img-${id}"></div>
              <div class="card-body" id="body-${id}" data-selected-model="${d.variacoes[0].id}">
                <div style="font-size:18px; font-weight:700;">${marca} ${mod}</div>
                <div class="selector-label">Modelo:</div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:15px;">
                  ${d.variacoes
                    .map(
                      (v, index) => `
                    <div class="model-box ${index === 0 ? "active" : ""}" onclick="selectModel(this, '${id}', '${v.img}', '${v.id}')">
                      ${v.id}
                    </div>
                  `,
                    )
                    .join("")}
                </div>
                <div class="selector-label">Tamanho:</div>
                <select id="tam-${id}">${d.tamanhos.map((t) => `<option value="${t}">${t}</option>`).join("")}</select>
                <div class="card-footer">
                  <div class="price">35€</div>
                  <a href="#" onclick="orderSneaker('${marca}','${mod}','${id}')" class="btn-buy">Encomendar</a>
                </div>
              </div>
            </div>
          `;
          })
          .join("");
      }
      aaaaa;

      function selectModel(el, id, imgPath, modelId) {
        document.getElementById(`img-${id}`).src = imgPath;
        const parent = el.parentElement;
        parent
          .querySelectorAll(".model-box")
          .forEach((box) => box.classList.remove("active"));
        el.classList.add("active");
        document
          .getElementById(`body-${id}`)
          .setAttribute("data-selected-model", modelId);
      }

      function resetSneakers() {
        renderSneakerBrands();
        document.getElementById("breadcrumb").style.display = "none";
      }

      function orderSneaker(marca, mod, id) {
        const modelo = document
          .getElementById(`body-${id}`)
          .getAttribute("data-selected-model");
        const tam = document.getElementById(`tam-${id}`).value;
        const txt = encodeURIComponent(
          `Olá! Quero os ténis:\n👟 *${marca} ${mod}*\n📦 ${modelo}\n📏 Tamanho: ${tam}\n💰 Preço: 35€`,
        );
        window.open(`https://wa.me/${WHATSAPP}?text=${txt}`);
      }

      renderNormalProducts("Eletrónicos");
    </script>
  </body>
</html>
